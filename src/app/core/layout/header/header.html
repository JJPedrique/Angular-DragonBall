<header class="bg-capsula-900 text-white">
  <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-3 px-6 py-5">
    <!-- [E40] routerLink navega sin recargar (no usar href) -->
    <a routerLink="/" class="flex items-center gap-3">
      <span class="grid size-11 place-items-center rounded-full bg-ki-500 text-white">
        <svg lucideStar class="size-6 fill-red-500"></svg>
      </span>
      <div>
        <h1 class="text-2xl font-bold tracking-tight">{{ titulo() }}</h1>
        <p class="text-sm text-white/70">Personajes de Dragon Ball</p>
      </div>
    </a>

    <!-- [E41] routerLinkActive pone la clase si esa ruta está activa -->
    <nav class="ml-auto flex items-center gap-1 text-sm">
      <a routerLink="/personajes" routerLinkActive="bg-white/15" class="rounded-md px-3 py-1.5 hover:bg-white/10">Personajes</a>
      <a routerLink="/planetas" routerLinkActive="bg-white/15" class="rounded-md px-3 py-1.5 hover:bg-white/10">Planetas</a>
      <a routerLink="/favoritos" routerLinkActive="bg-white/15" class="flex items-center gap-1.5 rounded-md px-3 py-1.5 hover:bg-white/10">
        <svg lucideStar class="size-4 fill-ki-500 text-ki-500"></svg>
        Favoritos ( {{ favs.personajesTotal() }} | {{favs.planetasTotal()}} )
      </a>
      <a routerLink="/sugerir" routerLinkActive="bg-white/15" class="rounded-md px-3 py-1.5 hover:bg-white/10">Sugerir</a>
    </nav>
  </div>
</header>
