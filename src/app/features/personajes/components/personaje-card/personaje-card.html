<!-- [E21] @let: variable de la plantilla para no repetir personaje() -->
@let p = personaje();

<!--
  En masonry ya no usamos h-full: cada tarjeta tiene su propia altura.
  flex-col se mantiene para ordenar imagen, datos y botón de arriba a abajo.
-->
<!-- [E22] [class.nombre]="condición" pone o quita una clase -->
<article
  class="flex flex-col overflow-hidden rounded-xl border bg-white shadow-sm transition"
  [class.border-stone-200]="!esFavorito()"
  [class.border-ki-500]="esFavorito()"
  [class.ring-2]="esFavorito()"
  [class.ring-ki-500]="esFavorito()"
>
  <!--
    Versión masonry: la caja de la imagen NO tiene altura fija.
    Cada tarjeta mide lo que mide su foto, y las columnas de la lista
    (columns-* en el padre) las acomodan una debajo de otra, estilo Pinterest.
    - w-full h-auto: la imagen ocupa el ancho de la tarjeta y su alto es proporcional.
    - Compara con el tag paso-06, donde la caja tenía h-64 fija.
  -->
  <div class="flex justify-center bg-linear-to-b from-ki-100 to-ki-50 p-4">
    <!-- [E23] (error) del img cambia el signal y el @if muestra un ícono -->
    @if (imagenFallo()) {
      <!-- Si la imagen no carga, (error) cambia el signal y mostramos un ícono -->
      <svg lucideImageOff class="my-12 size-12 text-stone-400"></svg>
    } @else {
      <img [src]="p.image" [alt]="p.name" loading="lazy" (error)="imagenFallo.set(true)" class="h-auto w-full object-contain" />
    }
  </div>

  <div class="flex flex-1 flex-col gap-2 p-4">
    <h3 class="text-lg font-semibold leading-tight">
      <!-- [E42] routerLink con arreglo -> /personajes/1 -->
      <a [routerLink]="['/personajes', p.id]" class="hover:text-capsula-700 hover:underline">{{ p.name }}</a>
    </h3>

    <div class="flex flex-wrap gap-1.5 text-xs">
      <span class="rounded-full bg-capsula-700 px-2 py-0.5 font-medium text-white">{{ p.race }}</span>
      <span class="rounded-full bg-stone-100 px-2 py-0.5 text-stone-700">
        <!-- [E24] @switch / @case: traducir el género -->
        @switch (p.gender) {
          @case ('Male') { Masculino }
          @case ('Female') { Femenino }
          @default { Desconocido }
        }
      </span>
    </div>

    <p class="flex items-center gap-1 text-sm text-stone-600">
      <svg lucideZap class="size-4 text-ki-600"></svg>
      Ki: <span class="font-medium text-stone-900">{{ p.ki }}</span>
    </p>
    <p class="text-xs text-stone-500">{{ p.affiliation }}</p>

    <!-- [E25] (click) -> marcar() -> emit(). [class] con ternario y aria-pressed -->
    <button
      type="button"
      (click)="marcar()"
      [attr.aria-pressed]="esFavorito()"
      class="mt-auto flex items-center justify-center gap-1.5 rounded-lg border px-3 py-1.5 text-sm font-medium transition"
      [class]="esFavorito() ? 'border-ki-500 bg-ki-500 text-white' : 'border-stone-300 text-stone-700 hover:bg-stone-50'"
    >
      <svg lucideStar class="size-4" [class.fill-current]="esFavorito()"></svg>
      {{ esFavorito() ? 'Favorito' : 'Marcar favorito' }}
    </button>
  </div>
</article>
